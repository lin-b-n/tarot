<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神秘塔罗牌占卜 - 命运之镜</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', 'SimSun', serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0d0d2b 100%);
            min-height: 100vh;
            color: #e8d5b7;
            overflow-x: hidden;
        }
        .stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
            background-image:
                radial-gradient(2px 2px at 20px 30px, #fff, transparent),
                radial-gradient(2px 2px at 40px 70px, #ffd700, transparent),
                radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                radial-gradient(1px 1px at 160px 120px, #fff, transparent),
                radial-gradient(2px 2px at 200px 50px, #ffd700, transparent),
                radial-gradient(1px 1px at 250px 80px, #fff, transparent),
                radial-gradient(2px 2px at 300px 150px, #fff, transparent),
                radial-gradient(1px 1px at 350px 200px, #ffd700, transparent),
                radial-gradient(2px 2px at 400px 100px, #fff, transparent),
                radial-gradient(1px 1px at 450px 180px, #fff, transparent);
            background-repeat: repeat;
            background-size: 500px 250px;
            animation: twinkle 4s ease-in-out infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 0.4; }
        }
        .container {
            max-width: 1200px; margin: 0 auto; padding: 20px;
            position: relative; z-index: 1;
        }
        .header {
            text-align: center; padding: 40px 20px;
        }
        .moon {
            width: 100px; height: 100px;
            background: radial-gradient(circle at 30% 30%, #fff8dc, #ffd700, #daa520);
            border-radius: 50%; margin: 0 auto 20px;
            box-shadow: 0 0 60px #ffd700, 0 0 100px #ffa500;
            position: relative;
        }
        .moon::before, .moon::after {
            content: ''; position: absolute;
            background: radial-gradient(circle, #b8860b, #8b6914);
            border-radius: 50%;
        }
        .moon::before { width: 20px; height: 20px; top: 25px; left: 30px; }
        .moon::after { width: 14px; height: 14px; top: 55px; left: 50px; }
        h1 {
            font-size: 2.8rem;
            background: linear-gradient(90deg, #ffd700, #fff8dc, #ffd700);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; margin-bottom: 10px;
        }
        .subtitle { color: #b8a9c9; font-size: 1.2rem; font-style: italic; }
        .spread-selection { text-align: center; padding: 30px 20px; }
        .spread-selection h2 { color: #ffd700; margin-bottom: 25px; font-size: 1.6rem; }
        .spread-options {
            display: flex; justify-content: center; gap: 25px; flex-wrap: wrap;
        }
        .spread-card {
            background: linear-gradient(145deg, rgba(138, 43, 226, 0.25), rgba(75, 0, 130, 0.35));
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 20px; padding: 30px 25px;
            width: 220px; cursor: pointer; transition: all 0.4s ease;
        }
        .spread-card:hover {
            transform: translateY(-15px) scale(1.05);
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.4);
            border-color: #ffd700;
        }
        .spread-card.selected {
            border-color: #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
            background: linear-gradient(145deg, rgba(138, 43, 226, 0.5), rgba(75, 0, 130, 0.6));
        }
        .spread-icon { font-size: 3.5rem; margin-bottom: 15px; }
        .spread-card h3 { color: #ffd700; margin-bottom: 10px; font-size: 1.3rem; }
        .spread-card p { color: #b8a9c9; font-size: 0.95rem; line-height: 1.5; }
        .question-section {
            text-align: center; padding: 40px 20px; display: none;
        }
        .question-section h2 { color: #ffd700; margin-bottom: 20px; }
        .question-input {
            width: 100%; max-width: 600px; height: 120px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 215, 0, 0.4);
            border-radius: 15px; padding: 20px;
            color: #e8d5b7; font-size: 1.1rem; resize: none;
            margin-bottom: 25px; transition: all 0.3s ease;
        }
        .question-input::placeholder { color: #666; }
        .question-input:focus {
            outline: none; border-color: #ffd700;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
        }
        .draw-btn {
            background: linear-gradient(145deg, #8a2be2, #4b0082);
            color: #ffd700; border: 2px solid #ffd700;
            border-radius: 35px; padding: 18px 60px;
            font-size: 1.3rem; cursor: pointer; transition: all 0.3s ease;
            font-family: inherit;
        }
        .draw-btn:hover {
            background: linear-gradient(145deg, #9a4bff, #5b00a2);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.6);
            transform: scale(1.08);
        }
        .card-area { padding: 50px 20px; display: none; }
        .cards-layout {
            display: flex; justify-content: center; align-items: center;
            flex-wrap: wrap; gap: 35px; min-height: 400px;
        }
        .card-slot {
            position: relative; width: 150px; height: 240px;
            perspective: 1200px;
        }
        .card-wrapper {
            width: 100%; height: 100%; position: relative;
            transform-style: preserve-3d; transition: transform 1s ease;
        }
        .card-wrapper.flipped { transform: rotateY(180deg); }
        .card-front, .card-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 12px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }
        .card-back {
            background: linear-gradient(145deg, #1a1a4e, #2d1b69);
            border: 3px solid #ffd700; cursor: pointer;
        }
        .card-back::before {
            content: '✦'; font-size: 3.5rem; color: #ffd700;
        }
        .card-back::after {
            content: '塔罗牌'; font-size: 1.1rem; color: #b8a9c9; margin-top: 12px;
        }
        .card-back:hover { box-shadow: 0 0 30px rgba(255, 215, 0, 0.6); }
        .card-front {
            background: linear-gradient(145deg, #2d1b69, #1a1a4e);
            border: 3px solid #ffd700; transform: rotateY(180deg);
            padding: 15px; text-align: center;
        }
        .card-front .card-image { font-size: 3.5rem; margin-bottom: 8px; }
        .card-front .card-name { color: #ffd700; font-size: 1rem; font-weight: bold; }
        .card-front .card-name-en { color: #b8a9c9; font-size: 0.75rem; margin-top: 3px; }
        .card-slot-label {
            position: absolute; bottom: -30px; left: 50%;
            transform: translateX(-50%); color: #b8a9c9;
            font-size: 0.85rem; white-space: nowrap;
        }
        .reading-section { padding: 50px 20px; display: none; text-align: center; }
        .reading-section h2 { color: #ffd700; margin-bottom: 35px; font-size: 2rem; }
        .reading-content {
            max-width: 850px; margin: 0 auto 40px; text-align: left;
        }
        .reading-card {
            background: linear-gradient(145deg, rgba(138, 43, 226, 0.2), rgba(75, 0, 130, 0.3));
            border: 1px solid rgba(255, 215, 0, 0.4);
            border-radius: 18px; padding: 30px; margin-bottom: 25px;
            animation: fadeInUp 0.6s ease forwards;
        }
        .reading-card:nth-child(1) { animation-delay: 0.1s; }
        .reading-card:nth-child(2) { animation-delay: 0.2s; }
        .reading-card:nth-child(3) { animation-delay: 0.3s; }
        .reading-card:nth-child(4) { animation-delay: 0.4s; }
        .reading-card:nth-child(5) { animation-delay: 0.5s; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .reading-card h3 { color: #ffd700; margin-bottom: 12px; font-size: 1.4rem; }
        .card-position { color: #b8a9c9; font-size: 0.9rem; margin-bottom: 18px; }
        .keywords { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
        .keyword-tag {
            background: rgba(255, 215, 0, 0.25); color: #ffd700;
            padding: 5px 15px; border-radius: 20px; font-size: 0.85rem;
        }
        .meaning { line-height: 1.9; color: #e8d5b7; font-size: 1.05rem; }
        .meaning.reversed { color: #ff9999; }
        .summary-box {
            background: linear-gradient(145deg, rgba(255, 215, 0, 0.1), rgba(138, 43, 226, 0.15));
            border: 2px solid rgba(255, 215, 0, 0.5);
            border-radius: 20px; padding: 35px; margin-bottom: 30px;
        }
        .summary-box h3 { color: #ffd700; margin-bottom: 15px; font-size: 1.5rem; }
        .summary-box p { line-height: 1.9; color: #e8d5b7; font-size: 1.1rem; }
        .reset-btn {
            background: transparent; color: #ffd700;
            border: 2px solid #ffd700; border-radius: 30px;
            padding: 15px 50px; font-size: 1.1rem; cursor: pointer;
            transition: all 0.3s ease; font-family: inherit;
        }
        .reset-btn:hover {
            background: rgba(255, 215, 0, 0.15);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
        }
        .footer {
            text-align: center; padding: 40px;
            color: #666; font-size: 0.9rem;
        }
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .spread-card { width: 160px; padding: 20px 15px; }
            .card-slot { width: 120px; height: 190px; }
            .card-front .card-image { font-size: 2.5rem; }
        }
        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 26, 0.9); display: none;
            justify-content: center; align-items: center; z-index: 1000;
        }
        .loading-overlay.active { display: flex; }
        .loading-content { text-align: center; }
        .loading-content::before {
            content: '🔮'; font-size: 5rem;
            animation: pulse 1.5s ease-in-out infinite;
            display: block;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
        }
        .loading-content p { color: #b8a9c9; margin-top: 20px; font-size: 1.2rem; }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <p>命运之轮正在转动...</p>
        </div>
    </div>
    <div class="container">
        <header class="header">
            <div class="moon"></div>
            <h1>✨ 神秘塔罗牌占卜 ✨</h1>
            <p class="subtitle">揭示命运的密码，探索内心的真相</p>
        </header>
        <section class="spread-selection" id="spreadSelection">
            <h2>选择你的牌阵</h2>
            <div class="spread-options">
                <div class="spread-card" data-spread="single">
                    <div class="spread-icon">🌙</div>
                    <h3>单张牌阵</h3>
                    <p>快速获取今日指引与启示</p>
                </div>
                <div class="spread-card" data-spread="three">
                    <div class="spread-icon">⭐</div>
                    <h3>三张牌阵</h3>
                    <p>过去·现在·未来的命运轨迹</p>
                </div>
                <div class="spread-card" data-spread="celtic">
                    <div class="spread-icon">🔮</div>
                    <h3>凯尔特十字</h3>
                    <p>全面解析当前处境的深层含义</p>
                </div>
            </div>
        </section>
        <section class="question-section" id="questionSection">
            <h2>在心中默念你的问题</h2>
            <textarea class="question-input" id="questionInput" placeholder="例如：我的爱情运势如何？未来事业走向怎样？"></textarea>
            <button class="draw-btn" id="drawBtn">开始占卜</button>
        </section>
        <section class="card-area" id="cardArea">
            <div class="cards-layout" id="cardsLayout"></div>
        </section>
        <section class="reading-section" id="readingSection">
            <h2>🔮 塔罗解读</h2>
            <div class="reading-content" id="readingContent"></div>
            <button class="reset-btn" id="resetBtn">重新占卜</button>
        </section>
        <footer class="footer">
            <p>🌟 塔罗牌指引内心，命运掌握在自己手中 🌟</p>
        </footer>
    </div>
    <script>
const tarotCards = [
  { id:0, name:"愚者", en:"The Fool", num:"0", img:"🃏", kws:["新的开始","冒险","天真","自由"], up:"新的开始，冒险精神，无限可能。愚者代表人生起点，勇敢迈出第一步，相信宇宙指引。", rev:"鲁莽行事，缺乏计划。提醒你要谨慎，不要过于冲动。", elem:"风", kw:"新的旅程" },
  { id:1, name:"魔术师", en:"The Magician", num:"I", img:"🎩", kws:["创造力","意志","技巧","行动"], up:"拥有实现目标的一切资源。创造力与意志力兼备，是转化想法为现实的最佳时机。", rev:"能力被误用，欺骗，缺乏方向。注意是否虚耗精力或被误导。", elem:"水星", kw:"创造之力" },
  { id:2, name:"女祭司", en:"The High Priestess", num:"II", img:"🌙", kws:["直觉","神秘","潜意识","智慧"], up:"倾听内心声音，直觉正在指引你。秘密即将揭晓，相信你的第六感。", rev:"忽视直觉，被表象迷惑。重新连接内在智慧。", elem:"月亮", kw:"内在智慧" },
  { id:3, name:"皇后", en:"The Empress", num:"III", img:"👑", kws:["丰饶","美丽","母性","创造"], up:"丰收与创造力的象征。艺术、爱情、生育方面将有收获，享受丰盛美好。", rev:"创造力受阻，依赖性强。关注自己需求，不要过度付出。", elem:"金星", kw:"丰盛创造" },
  { id:4, name:"皇帝", en:"The Emperor", num:"IV", img:"⚔️", kws:["权威","结构","控制","稳定"], up:"建立秩序与规则的时刻。展现领导力，用理性掌控局面，稳定带来力量。", rev:"过度控制，固执僵化。平衡控制与灵活，避免独断。", elem:"白羊座", kw:"权威掌控" },
  { id:5, name:"教皇", en:"The Hierophant", num:"V", img:"🔑", kws:["传统","信仰","指导","学习"], up:"寻求传统智慧和精神指导。贵人相助，在信仰教育方面有收获。", rev:"打破传统，质疑权威。可以走自己的路。", elem:"金牛座", kw:"智慧指引" },
  { id:6, name:"恋人", en:"The Lovers", num:"VI", img:"💕", kws:["爱情","选择","和谐","联合"], up:"重要情感选择出现。跟随内心声音，无论是爱情还是人生抉择。", rev:"关系失衡，错误选择。反思问题，做出正确选择。", elem:"双子座", kw:"情感选择" },
  { id:7, name:"战车", en:"The Chariot", num:"VII", img:"🏇", kws:["胜利","意志","征服","前进"], up:"通过意志力克服困难，取得胜利。坚定目标，克服障碍到达成功彼岸。", rev:"失去控制，方向不明。重新审视目标，找回内在平衡。", elem:"巨蟹座", kw:"意志胜利" },
  { id:8, name:"力量", en:"Strength", num:"VIII", img:"🦁", kws:["勇气","耐心","内在力量","慈悲"], up:"用内在力量而非暴力面对挑战。勇气与耐心结合将帮助你克服困难。", rev:"内心恐惧，缺乏勇气。找到内在力量源泉，相信自己。", elem:"狮子座", kw:"内在力量" },
  { id:9, name:"隐者", en:"The Hermit", num:"IX", img:"🏔️", kws:["独处","内省","智慧","寻找"], up:"内省与独处的时期。远离喧嚣，寻找内心答案，智慧来自沉默与反思。", rev:"过度孤立，逃避现实。适当社交，不要过度封闭。", elem:"处女座", kw:"内在探索" },
  { id:10, name:"命运之轮", en:"Wheel of Fortune", num:"X", img:"☸️", kws:["命运","变化","机遇","循环"], up:"命运的转折点，好运即将降临。接受变化，新机遇在等待。", rev:"厄运，停滞，抗拒变化。顺应命运变化，不要顽固抵抗。", elem:"木星", kw:"命运转折" },
  { id:11, name:"正义", en:"Justice", num:"XI", img:"⚖️", kws:["公正","平衡","因果","真理"], up:"公正与平衡的时刻。行为将得到公平回报，因果法则发挥作用。", rev:"不公，偏见，逃避责任。行事要公正，承担应负责任。", elem:"天秤座", kw:"公正平衡" },

  { id:18, name:"月亮", en:"The Moon", num:"XVIII", img:"🌕", kws:["幻象","潜意识","恐惧","直觉"], up:"面对内心恐惧和幻象。不要被表象迷惑，相信直觉，穿越迷雾。", rev:"走出迷茫，看清真相。黑暗终将过去，真相会大白。", elem:"双鱼座", kw:"穿越迷雾" },
  { id:19, name:"太阳", en:"The Sun", num:"XIX", img:"☀️", kws:["快乐","成功","活力","光明"], up:"最积极的牌之一，带来快乐与成功。一切向好的方向发展，享受光明。", rev:"暂时受阻，乐观不足。不要过于自信，保持清醒判断。", elem:"太阳", kw:"光明快乐" },
  { id:20, name:"审判", en:"Judgement", num:"XX", img:"📯", kws:["觉醒","重生","反思","召唤"], up:"灵魂觉醒与重生。反思过去，接受召唤，迎来人生新篇章。", rev:"自我否定，逃避反省。勇敢面对过去，才能走向未来。", elem:"火", kw:"灵魂觉醒" },

];

const spreads = {
  single: { name:"单张牌阵", positions:["今日指引"], maxCards:1 },
  three: { name:"三张牌阵", positions:["过去","现在","未来"], maxCards:3 },
  celtic: { name:"凯尔特十字", positions:["现状","挑战","基础","过去","最佳可能","未来","自我","环境","希望与恐惧","最终结果"], maxCards:10 }
};

const state = { selectedSpread:null, drawnCards:[], phase:'select' };

document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.spread-card').forEach(card => {
    card.addEventListener('click', () => {
      document.querySelectorAll('.spread-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      state.selectedSpread = card.dataset.spread;
      document.getElementById('spreadSelection').style.display = 'none';
      document.getElementById('questionSection').style.display = 'block';
      state.phase = 'question';
    });
  });
  document.getElementById('drawBtn').addEventListener('click', startDraw);
  document.getElementById('resetBtn').addEventListener('click', () => location.reload());
});

function startDraw() {
  const spread = spreads[state.selectedSpread];
  document.getElementById('questionSection').style.display = 'none';
  document.getElementById('cardArea').style.display = 'block';
  state.phase = 'drawing';
  state.drawnCards = [];
  const shuffled = [...tarotCards].sort(() => Math.random() - 0.5);
  const layout = document.getElementById('cardsLayout');
  layout.innerHTML = '';
  layout.className = 'cards-layout ' + state.selectedSpread;
  for (let i = 0; i < spread.maxCards; i++) {
    const card = shuffled[i];
    const isReversed = Math.random() > 0.5;
    state.drawnCards.push({ ...card, isReversed });
    const slot = document.createElement('div');
    slot.className = 'card-slot';
    slot.innerHTML = 
      '<div class="card-wrapper" id="card-' + i + '">' +
        '<div class="card-back" onclick="flipCard(' + i + ')"></div>' +
        '<div class="card-front">' +
          '<div class="card-image">' + card.img + '</div>' +
          '<div class="card-name">' + card.name + '</div>' +
          '<div class="card-name-en">' + card.en + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="card-slot-label">' + spread.positions[i] + '</div>';
    layout.appendChild(slot);
  }
}

function flipCard(index) {
  const card = document.getElementById('card-' + index);
  if (!card.classList.contains('flipped')) {
    card.classList.add('flipped');
    const allFlipped = document.querySelectorAll('.card-wrapper.flipped').length;
    if (allFlipped === state.drawnCards.length) {
      setTimeout(showReading, 1200);
    }
  }
}

function showReading() {
  document.getElementById('cardArea').style.display = 'none';
  document.getElementById('readingSection').style.display = 'block';
  state.phase = 'reading';
  const spread = spreads[state.selectedSpread];
  const content = document.getElementById('readingContent');
  content.innerHTML = '';
  const summary = document.createElement('div');
  summary.className = 'summary-box';
  const cards = state.drawnCards;
  const keywords = cards.flatMap(c => c.kws);
  const uniqueKws = [...new Set(keywords)];
  let summaryText = '';
  if (state.selectedSpread === 'single') {
    summaryText = '你今天抽到的是「' + cards[0].name + '」' + (cards[0].isReversed ? '（逆位）' : '（正位）') + '。<br><br>' + cards[0].up;
  } else if (state.selectedSpread === 'three') {
    summaryText = '过去抽到「' + cards[0].name + '」，现在抽到「' + cards[1].name + '」，未来抽到「' + cards[2].name + '」。<br><br>' +
      '这三张牌告诉你，<strong>' + uniqueKws.slice(0,3).join('、') + '</strong>是你当前需要关注的主题。<br><br>请结合每张牌的具体解读，理解命运给你的指引。';
  } else {
    summaryText = '凯尔特十字牌阵为你揭示了完整的命运图景。<br><br>核心主题是：<strong>' + uniqueKws.slice(0,2).join('与') + '</strong>。<br><br>请仔细阅读每张牌的位置解读，它们将为你指明方向。';
  }
  summary.innerHTML = '<h3>🔮 综合解读</h3><p>' + summaryText + '</p>';
  content.appendChild(summary);
  cards.forEach((card, index) => {
    const cardReading = document.createElement('div');
    cardReading.className = 'reading-card';
    cardReading.innerHTML = 
      '<h3>' + card.img + ' ' + card.name + ' ' + (card.isReversed ? '(逆位)' : '(正位)') + '</h3>' +
      '<p class="card-position">位置：' + spread.positions[index] + ' — ' + card.kw + '</p>' +
      '<div class="keywords">' + card.kws.map(k => '<span class="keyword-tag">' + k + '</span>').join('') + '</div>' +
      '<p class="meaning' + (card.isReversed ? ' reversed' : '') + '">' + (card.isReversed ? card.rev : card.up) + '</p>';
    content.appendChild(cardReading);
  });
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') location.reload(); });
